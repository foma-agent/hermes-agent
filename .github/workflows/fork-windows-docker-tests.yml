name: "Fork: Windows targeted tests"

# The upstream PR workflow is approval-gated for fork contributions. This
# fork-owned dispatcher gives an exact upstream commit a native Windows
# acceptance run without changing the product branch or copying its code into
# the workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact commit SHA to test"
        required: true
        type: string
      suite:
        description: "Named test suite"
        required: true
        default: docker
        type: choice
        options:
          - docker
          - profile-scratch
          - scratch-dir
          - approval-policy

permissions:
  contents: read

concurrency:
  group: fork-windows-${{ github.ref }}-${{ inputs.suite }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  targeted-tests:
    name: ${{ inputs.suite }} tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # A workflow_dispatch defaults to the repository default branch. Fail that
      # mistake before checkout so a no-test run cannot look like acceptance and
      # contributor code never enters the default branch's cache scope.
      - name: Refuse default branch cache scope
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          echo "::error::dispatch with --ref set to a dedicated non-default branch"
          exit 1

      - name: Validate exact commit input
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.ref }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full lowercase commit SHA"
            exit 1
          fi

      # workflow_dispatch is restricted to repository writers; the validation
      # above also prevents a branch name or shell-shaped value reaching checkout.
      # The fixed public upstream lets this fork test another contributor's PR
      # head without first republishing that commit under foma-agent.
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.ref }}
        run: |
          resolved_sha="$(git rev-parse HEAD)"
          echo "target=$TARGET_SHA"
          echo "resolved=$resolved_sha"
          git log -1 --format='commit=%H subject=%s'
          if [[ "$resolved_sha" != "$TARGET_SHA" ]]; then
            echo "::error::checkout resolved $resolved_sha instead of $TARGET_SHA"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          # The checked-out commit may be an untrusted contributor head. Do not
          # let its install or tests write a cache restored by later fork jobs.
          enable-cache: false

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if uv sync --locked --python 3.14 --extra all --group dev \
              --extra anthropic --extra mistral --extra fal --extra modal \
              --extra daytona --extra parallel-web; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::dependency install failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::dependency install attempt $attempt failed; retrying in 10s"
            sleep 10
          done

      - name: Run the Docker environment files on native Windows
        if: inputs.suite == 'docker'
        run: >-
          uv run --no-sync python -m pytest
          tests/tools/test_docker_environment.py
          tests/tools/test_docker_environment_reuse.py
          -m "not integration" -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Run the profile scratch files on native Windows
        if: inputs.suite == 'profile-scratch'
        run: >-
          uv run --no-sync python -m pytest
          tests/test_scratch_profile_pruning.py
          tests/test_scratch_dir.py
          tests/test_scratch_scan_failures.py
          tests/test_hermes_bootstrap.py
          tests/hermes_cli/test_apply_profile_override.py
          -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Run the scratch directory fixture on native Windows
        if: inputs.suite == 'scratch-dir'
        run: >-
          uv run --no-sync python -m pytest
          tests/test_scratch_dir.py
          -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      # These files also carry unrelated tests with known native-Windows assumptions.
      # Select every test function added or modified by the approval-policy change.
      - name: Run the approval policy files on native Windows
        if: inputs.suite == 'approval-policy'
        run: >-
          uv run --no-sync python -m pytest
          tests/gateway/test_approvals_command.py
          tests/hermes_cli/test_approvals_command.py
          tests/hermes_cli/test_config.py
          tests/hermes_cli/test_config_set_coercion.py
          tests/hermes_cli/test_config_set_list_values.py
          tests/hermes_cli/test_console_engine_config_guard.py
          tests/hermes_cli/test_set_config_value.py
          tests/tools/test_approval.py
          tests/tools/test_approval_config_set_policy.py
          tests/tools/test_approval_detection_policy_gate.py
          tests/tui_gateway/test_approvals_policy_chokepoint.py
          tests/tui_gateway/test_config_set_policy_write.py
          tests/tui_gateway/test_tui_gateway_server.py
          -k "test_gateway_rejects_approval_change_without_configured_policy or
          test_gateway_allows_query_without_configured_policy or
          test_gateway_allows_admin_change_with_configured_policy or
          test_windows_policy_denies_mixed_case_exec_names or
          test_unbound_approvals_handler_refused or
          test_sanctioned_repl_process_command_persists or
          test_enum_off_stays_string or
          test_string_typed_key_bracket_value_stays_string or
          test_string_typed_key_negative_number_stays_string or
          test_console_engine_refuses_sensitive_keys or
          test_non_sensitive_keys_not_refused or
          test_operator_scope_skips_guard or
          test_operator_scope_without_human_still_refused or
          test_unbound_grant_operator_policy_write_raises_without_sanctioned_boundary or
          test_string_typed_values_are_not_coerced or
          test_non_string_defaults_keep_existing_coercion or
          test_sensitive_key_refused_without_force or
          test_sensitive_key_allowed_for_operator_scope or
          test_cli_set_refuses_sensitive_key_even_with_force or
          test_sensitive_key_refused_with_generic_force or
          test_cli_set_force_still_works_for_non_sensitive_key or
          test_approvals_mode_refusal_mentions_canonical_command or
          test_non_sensitive_keys_still_work or
          test_unset_sensitive_key_refused or
          test_public_cli_child_cannot_persist_executable_policy or
          test_sensitive_guard_runs_before_yaml_parse or
          test_security_policy_keys_detected or
          test_quoted_security_policy_keys_detected or
          test_python_dash_m_entrypoint_detected or
          test_benign_python_dash_m_not_flagged or
          test_benign_config_set_not_flagged or
          test_executable_policy_keys_detected or
          test_approvals_suggest_apply_detected or
          test_approvals_suggest_dry_run_not_flagged or
          test_mode_change_spelling_detected or
          test_long_global_flag_run_is_checked_in_bounded_time or
          test_approvals_suggest_apply_abbreviations_detected or
          test_policy_spellings_still_detected_under_global_flags or
          test_tui_raw_write_config_key_bypass_refused or
          test_tui_policy_write_without_transport_refused or
          test_forged_object_transport_refused or
          test_forged_real_transport_instance_refused or
          test_tui_sanctioned_policy_write_persists or
          test_tui_rpc_config_set_approvals_mode_persists or
          test_tui_rpc_config_set_yolo_global_persists or
          test_sanctioned_frame_tables_cover_every_human_input_surface or
          test_config_set_yolo_global_scope_writes_approvals_mode or
          test_config_set_approval_mode_persists_three_way_value_and_emits_live_status or
          test_config_set_yolo_global_scope_honors_explicit_value or
          test_managed_install_reports_rpc_error_not_success or
          test_pinned_key_survives_as_rpc_error"
          -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
