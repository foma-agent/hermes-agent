name: "Fork: Windows targeted tests"

# The upstream PR workflow is approval-gated for fork contributions. This
# fork-owned dispatcher gives an exact upstream commit a native Windows
# acceptance run without changing the product branch or copying its code into
# the workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact commit SHA to test"
        required: true
        type: string
      suite:
        description: "Named test suite"
        required: true
        default: docker
        type: choice
        options:
          - docker
          - profile-scratch
          - scratch-dir

permissions:
  contents: read

concurrency:
  group: fork-windows-${{ github.ref }}-${{ inputs.suite }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  targeted-tests:
    name: ${{ inputs.suite }} tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # A workflow_dispatch defaults to the repository default branch. Fail that
      # mistake before checkout so a no-test run cannot look like acceptance and
      # contributor code never enters the default branch's cache scope.
      - name: Refuse default branch cache scope
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          echo "::error::dispatch with --ref set to a dedicated non-default branch"
          exit 1

      - name: Validate exact commit input
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.ref }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full lowercase commit SHA"
            exit 1
          fi

      # workflow_dispatch is restricted to repository writers; the validation
      # above also prevents a branch name or shell-shaped value reaching checkout.
      # The fixed public upstream lets this fork test another contributor's PR
      # head without first republishing that commit under foma-agent.
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Verify exact checkout
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.ref }}
        run: |
          resolved_sha="$(git rev-parse HEAD)"
          echo "target=$TARGET_SHA"
          echo "resolved=$resolved_sha"
          git log -1 --format='commit=%H subject=%s'
          if [[ "$resolved_sha" != "$TARGET_SHA" ]]; then
            echo "::error::checkout resolved $resolved_sha instead of $TARGET_SHA"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          # The checked-out commit may be an untrusted contributor head. Do not
          # let its install or tests write a cache restored by later fork jobs.
          enable-cache: false

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if uv sync --locked --python 3.14 --extra all --group dev \
              --extra anthropic --extra mistral --extra fal --extra modal \
              --extra daytona --extra parallel-web; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::dependency install failed after $attempt attempts"
              exit 1
            fi
            echo "::warning::dependency install attempt $attempt failed; retrying in 10s"
            sleep 10
          done

      - name: Run the Docker environment files on native Windows
        if: inputs.suite == 'docker'
        run: >-
          uv run --no-sync python -m pytest
          tests/tools/test_docker_environment.py
          tests/tools/test_docker_environment_reuse.py
          -m "not integration" -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Run the profile scratch files on native Windows
        if: inputs.suite == 'profile-scratch'
        run: >-
          uv run --no-sync python -m pytest
          tests/test_scratch_profile_pruning.py
          tests/test_scratch_dir.py
          tests/test_scratch_scan_failures.py
          tests/test_hermes_bootstrap.py
          tests/hermes_cli/test_apply_profile_override.py
          -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: Run the scratch directory fixture on native Windows
        if: inputs.suite == 'scratch-dir'
        run: >-
          uv run --no-sync python -m pytest
          tests/test_scratch_dir.py
          -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
