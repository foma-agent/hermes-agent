name: "Fork: Windows Docker tests"

# The upstream PR workflow is approval-gated for fork contributions. This
# fork-owned dispatcher gives an exact commit a native Windows acceptance run
# without changing the product branch or copying its code into the workflow.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact commit SHA to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fork-windows-docker-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  docker-environment:
    name: Docker environment tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Validate exact commit input
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.ref }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ref must be a full lowercase commit SHA"
            exit 1
          fi

      # workflow_dispatch is restricted to repository writers; the validation
      # above also prevents a branch name or shell-shaped value reaching checkout.
      - name: Checkout exact commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: >-
            uv sync --locked --python 3.14 --extra all --group dev
            --extra anthropic --extra mistral --extra fal --extra modal
            --extra daytona --extra parallel-web

      - name: Run the Docker environment file on native Windows
        run: >-
          uv run --no-sync python -m pytest
          tests/tools/test_docker_environment.py
          -m "not integration" -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
